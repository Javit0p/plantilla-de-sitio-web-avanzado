<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - TerraViviendaChilena</title>
    <link rel="stylesheet" href="estilo-de-la-pagina.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
<header>
    <div class="logo-titulo">
        <img src="imagenes/terraviviendachilena.jpg" alt="TerraViviendaChilena">
        <h1>TerraViviendaChilena</h1>
    </div>
    <nav>
        <a href="index.html">Inicio</a>
        <a href="propiedades.html">Propiedades</a>
        <a href="login.html">Login</a>
    </nav>
</header>

<main>
    <div class="login-container">
        <h1>Iniciar Sesión</h1>

        <form id="loginForm" onsubmit="simularLogin(event)">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="correo@ejemplo.com" required>

            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required>

            <button type="submit">Ingresar</button>

            <div class="registro-link">
                ¿No tienes cuenta? <a href="registro-del-propietario.html">Regístrate aquí</a>
            </div>
        </form>
    </div>
</main>

<footer>
    <p>© 2026 TerraViviendaChilena</p>
</footer>

<script>
function simularLogin(e) {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    if (email && password) {
        Swal.fire({
            icon: 'success',
            title: '¡Sesión iniciada!',
            text: 'Redirigiendo al panel de administración...',
            timer: 1500,
            showConfirmButton: false
        }).then(() => {
            window.location.href = 'dashboard.html';
        });
    }
}
</script>
</body>
</html>
